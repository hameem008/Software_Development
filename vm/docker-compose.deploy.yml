version: "3.8"

services:
  db:
    image: hameem08/mediline-db:latest
    container_name: my_postgres_db
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mediline-net

  backend:
    image: hameem08/mediline-backend:latest
    container_name: mediline-backend
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    depends_on:
      - db
    networks:
      - mediline-net

  frontend:
    image: hameem08/mediline-frontend:latest
    container_name: mediline-frontend
    ports:
      - "3000:80"
    env_file:
      - ./.env
    depends_on:
      - backend
    networks:
      - mediline-net

volumes:
  postgres_data:

networks:
  mediline-net:
    driver: bridge
