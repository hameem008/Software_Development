name: CI - Test, Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      # ✅ Fix Maven wrapper permissions with multiple approaches
      - name: 🛠 Fix Maven wrapper permissions
        working-directory: ./backend/MediLine
        run: |
          echo "📋 Current directory: $(pwd)"
          echo "📋 Files in directory:"
          ls -la
          if [ -f "mvnw" ]; then
            echo "📋 Found mvnw, checking permissions..."
            ls -la mvnw
            echo "🔧 Setting execute permissions..."
            chmod +x mvnw
            echo "✅ Verifying permissions after chmod..."
            ls -la mvnw
          else
            echo "❌ mvnw file not found!"
            exit 1
          fi

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔍 Verify Java setup
        run: |
          echo "📋 Java version:"
          java -version
          echo "📋 JAVA_HOME:"
          echo $JAVA_HOME
          echo "📋 Maven version:"
          mvn -version

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ✅ Run backend tests with Java 17 override
      - name: ⚙️ Run backend tests
        working-directory: ./backend/MediLine
        run: |
          if [ -x "./mvnw" ]; then
            echo "✅ Using Maven wrapper with Java 17..."
            ./mvnw clean test -Dmaven.compiler.source=17 -Dmaven.compiler.target=17 -Dmaven.compiler.release=17
          else
            echo "⚠️ Maven wrapper not executable, using Maven directly..."
            mvn clean test -Dmaven.compiler.source=17 -Dmaven.compiler.target=17 -Dmaven.compiler.release=17
          fi

      # ✅ Install frontend dependencies (for Cypress and dev server)
      - name: 📦 Install frontend dependencies
        working-directory: ./mediline-health-portal
        run: npm install

      # 🚀 Start backend server in background with Java 17
      - name: 🚀 Start Backend server
        working-directory: ./backend/MediLine
        run: |
          if [ -x "./mvnw" ]; then
            echo "✅ Using Maven wrapper to start server..."
            ./mvnw spring-boot:run -Dmaven.compiler.source=17 -Dmaven.compiler.target=17 -Dmaven.compiler.release=17 &
          else
            echo "⚠️ Maven wrapper not executable, using Maven directly..."
            mvn spring-boot:run -Dmaven.compiler.source=17 -Dmaven.compiler.target=17 -Dmaven.compiler.release=17 &
          fi

      # ⏳ Wait for backend server to be ready
      - name: ⏳ Wait for Backend to be ready
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8080/actuator/health; then
              echo "✅ Backend is up!"
              break
            fi
            echo "⏳ Waiting for backend..."
            sleep 5
          done

      # 🚀 Start frontend server in background (for Cypress)
      - name: 🚀 Start Frontend server
        working-directory: ./mediline-health-portal
        run: npm run dev &

      # ⏳ Wait for frontend server to be ready
      - name: ⏳ Wait for Frontend to be ready
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:5173; then
              echo "✅ Frontend is up!"
              break
            fi
            echo "⏳ Waiting for frontend..."
            sleep 5
          done

      # 🧪 Run Cypress end-to-end tests
      - name: 🧪 Run Cypress E2E tests
        working-directory: ./mediline-health-portal
        run: npx cypress run

      # 🛑 Kill background servers
      - name: 🛑 Kill servers
        run: |
          pkill -f 'spring-boot:run' || true
          pkill -f 'vite' || true

      # 🐳 Set up Docker Buildx
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 Log in to Docker Hub
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # 📦 Build and push DB image
      - name: 📦 Build & Push DB image
        uses: docker/build-push-action@v5
        with:
          context: ./db
          push: true
          tags: hameem08/mediline-db:latest

      # 📦 Build and push Backend image
      - name: 📦 Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/MediLine
          push: true
          tags: hameem08/mediline-backend:latest

      # 📦 Build and push Frontend image
      - name: 📦 Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./mediline-health-portal
          push: true
          tags: hameem08/mediline-frontend:latest



