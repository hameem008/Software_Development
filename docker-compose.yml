name: CI - Test, Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      # ✅ Fix Maven wrapper permissions
      - name: 🛠 Fix Maven wrapper permissions
        working-directory: ./backend/MediLine
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
          else
            echo "❌ mvnw file not found!"
            exit 1
          fi

      # ☕ Set up JDK 21 with explicit configuration
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          check-latest: true
          cache-dependency-path: '**/pom.xml'

      - name: 🔍 Verify Java setup
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Javac Version ==="
          javac -version
          echo "=== JAVA_HOME ==="
          echo $JAVA_HOME
          echo "=== Maven Version ==="
          mvn -version

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # ✅ Run backend tests with Java 21 verification
      - name: ⚙️ Run backend tests
        working-directory: ./backend/MediLine
        run: |
          echo "=== Verifying Java Version in Maven ==="
          ./mvnw -v
          echo "=== Building with Maven ==="
          ./mvnw clean test -B
          echo "=== Java Version Used in Build ==="
          ./mvnw help:evaluate -Dexpression=java.version -q -DforceStdout

      # Install frontend dependencies
      - name: 📦 Install frontend dependencies
        working-directory: ./mediline-health-portal
        run: npm ci

      # Start backend server in background with test profile
      - name: 🚀 Start Backend server
        working-directory: ./backend/MediLine
        run: |
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=test &

      # Wait for backend server to be ready
      - name: ⏳ Wait for Backend to be ready
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8080/actuator/health; then
              echo "✅ Backend is up!"
              break
            fi
            echo "⏳ Waiting for backend (attempt $i/30)..."
            sleep 5
          done

      # Start frontend server in background
      - name: 🚀 Start Frontend server
        working-directory: ./mediline-health-portal
        run: npm run dev &

      # Wait for frontend server to be ready
      - name: ⏳ Wait for Frontend to be ready
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:5173; then
              echo "✅ Frontend is up!"
              break
            fi
            echo "⏳ Waiting for frontend (attempt $i/30)..."
            sleep 5
          done

      # Run Cypress end-to-end tests
      - name: 🧪 Run Cypress E2E tests
        working-directory: ./mediline-health-portal
        run: npx cypress run

      # Kill background servers
      - name: 🛑 Kill servers
        run: |
          pkill -f 'spring-boot:run' || true
          pkill -f 'vite' || true

      # 🐳 Set up Docker Buildx
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 Log in to Docker Hub
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # 📦 Build and push DB image
      - name: 📦 Build & Push DB image
        uses: docker/build-push-action@v5
        with:
          context: ./db
          push: true
          tags: hameem08/mediline-db:latest

      # 📦 Build and push Backend image
      - name: 📦 Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/MediLine
          push: true
          tags: hameem08/mediline-backend:latest
          build-args:
            JAVA_VERSION: 21

      # 📦 Build and push Frontend image
      - name: 📦 Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./mediline-health-portal
          push: true
          tags: hameem08/mediline-frontend:latest



