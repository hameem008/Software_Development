name: CI - Test, Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Install backend dependencies & run backend tests
      - name: ⚙️ Run backend tests
        working-directory: ./backend/MediLine
        run: ./mvnw test

      # Install frontend dependencies (for Cypress and Vite dev server)
      - name: 📦 Install frontend dependencies
        working-directory: ./mediline-health-portal
        run: npm install

      # Start backend server in background
      - name: 🚀 Start Backend server
        working-directory: ./backend/MediLine
        run: ./mvnw spring-boot:run &

      # Wait for backend to start up
      - name: ⏳ Wait for Backend to be ready
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8080/actuator/health; then
              echo "Backend is up!"
              break
            fi
            echo "Waiting for backend..."
            sleep 5
          done

      # Start frontend server in background
      - name: 🚀 Start Frontend server
        working-directory: ./mediline-health-portal
        run: npm run dev &

      # Wait for frontend to start up
      - name: ⏳ Wait for Frontend to be ready
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:5173; then
              echo "Frontend is up!"
              break
            fi
            echo "Waiting for frontend..."
            sleep 5
          done

      # Run Cypress tests
      - name: 🧪 Run Cypress E2E tests
        working-directory: ./mediline-health-portal
        run: npx cypress run

      # Kill background servers after tests (optional)
      - name: 🛑 Kill servers
        run: |
          pkill -f 'spring-boot:run' || true
          pkill -f 'vite' || true

      # Docker steps for build & push
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: 📦 Build & Push DB image
        uses: docker/build-push-action@v5
        with:
          context: ./db
          push: true
          tags: hameem08/mediline-db:latest

      - name: 📦 Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/MediLine
          push: true
          tags: hameem08/mediline-backend:latest

      - name: 📦 Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./mediline-health-portal
          push: true
          tags: hameem08/mediline-frontend:latest



