name: CI - Test, Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Add PostgreSQL service for backend testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install frontend dependencies
        working-directory: ./mediline-health-portal
        run: npm install

      - name: 🧪 Run frontend unit tests
        working-directory: ./mediline-health-portal
        run: npm test

      - name: 🔨 Build frontend
        working-directory: ./mediline-health-portal
        run: npm run build

      - name: ⚙️ Set up backend dependencies and test
        working-directory: ./backend/MediLine
        env:
          SPRING_PROFILES_ACTIVE: test
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: ./mvnw test

      # E2E Testing Section
      - name: 🚀 Start backend for E2E tests
        working-directory: ./backend/MediLine
        env:
          SPRING_PROFILES_ACTIVE: test
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SERVER_PORT: 8080
        run: |
          ./mvnw spring-boot:run &
          echo $! > backend.pid
        
      - name: ⏳ Wait for backend to be ready
        run: |
          echo "Waiting for backend to start..."
          timeout 60 bash -c 'until curl -f http://localhost:8080/actuator/health 2>/dev/null; do sleep 2; done'
          echo "Backend is ready!"

      - name: 🚀 Start frontend for E2E tests
        working-directory: ./mediline-health-portal
        run: |
          npm run start &
          echo $! > frontend.pid
        env:
          CI: false

      - name: ⏳ Wait for frontend to be ready
        run: |
          echo "Waiting for frontend to start..."
          timeout 60 bash -c 'until curl -f http://localhost:3000 2>/dev/null; do sleep 2; done'
          echo "Frontend is ready!"

      - name: 🧪 Run Cypress E2E tests
        working-directory: ./mediline-health-portal
        run: |
          # Install Cypress if not already in package.json
          if ! npm list cypress --depth=0 2>/dev/null; then
            npm install --save-dev cypress
          fi
          
          # Run Cypress tests in headless mode
          npx cypress run --config baseUrl=http://localhost:3000 --spec "cypress/e2e/**/*.cy.js"
        env:
          CYPRESS_baseUrl: http://localhost:3000

      - name: 📸 Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: ./mediline-health-portal/cypress/screenshots
          retention-days: 7

      - name: 📹 Upload Cypress videos
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cypress-videos
          path: ./mediline-health-portal/cypress/videos
          retention-days: 7

      - name: 📊 Upload Cypress test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cypress-results
          path: ./mediline-health-portal/cypress/results
          retention-days: 7

      - name: 🛑 Stop services
        if: always()
        run: |
          # Stop frontend
          if [ -f ./mediline-health-portal/frontend.pid ]; then
            kill $(cat ./mediline-health-portal/frontend.pid) || true
          fi
          
          # Stop backend
          if [ -f ./backend/MediLine/backend.pid ]; then
            kill $(cat ./backend/MediLine/backend.pid) || true
          fi
          
          # Kill any remaining processes
          pkill -f "spring-boot:run" || true
          pkill -f "npm run start" || true

      # Docker Build & Push Section (only on main branch)
      - name: 🐳 Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: 📦 Build & Push DB image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./db
          push: true
          tags: hameem08/mediline-db:latest

      - name: 📦 Build & Push Backend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/MediLine
          push: true
          tags: hameem08/mediline-backend:latest

      - name: 📦 Build & Push Frontend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./mediline-health-portal
          push: true
          tags: hameem08/mediline-frontend:latest

