name: CI - Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: 📦 Build & Push DB image
        uses: docker/build-push-action@v5
        with:
          context: ./db
          push: true
          tags: hameem08/mediline-db:latest

      - name: 📦 Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/MediLine
          push: true
          tags: hameem08/mediline-backend:latest

      - name: 📦 Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./mediline-health-portal
          push: true
          tags: hameem08/mediline-frontend:latest

